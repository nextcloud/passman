name: PHPUnit PostgreSQL

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes-and-matrix:
    uses: ./.github/workflows/phpunit-prepare.yml
    with:
      extra-matrix: '{"pgsql-versions": ["16"]}'

  phpunit-pgsql:
    runs-on: ubuntu-latest-low

    needs: changes-and-matrix
    if: needs.changes-and-matrix.outputs.src != 'false'

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes-and-matrix.outputs.matrix) }}

    name: PostgreSQL ${{ matrix.pgsql-versions }} PHP ${{ matrix.php-versions }} Nextcloud ${{ matrix.server-versions }}

    services:
      postgres:
        image: ghcr.io/nextcloud/continuous-integration-postgres-${{ matrix.pgsql-versions }}:latest # zizmor: ignore[unpinned-images]
        ports:
          - 4444:5432/tcp
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: nextcloud
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 2s --health-retries 5

    steps:
      - name: Checkout app
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/phpunit
        with:
          database: pgsql
          php-version: ${{ matrix.php-versions }}
          server-version: ${{ matrix.server-versions }}
          php-db-extensions: pgsql, pdo_pgsql
          coverage: none
          phpunit-args: -- --no-coverage

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest-low
    needs: [changes-and-matrix, phpunit-pgsql]

    if: always()

    name: phpunit-pgsql-summary

    steps:
      - name: Summary status
        run: |
          if [ "${{ needs.changes-and-matrix.outputs.src }}" = "false" ]; then
            echo "No relevant changes detected, skipping."
            exit 0
          fi
          if [ "${{ needs.phpunit-pgsql.result }}" != "success" ]; then
            echo "PHPUnit job failed or was cancelled."
            exit 1
          fi
