name: PHPUnit prepare

on:
  workflow_call:
    inputs:
      extra-matrix:
        description: Extra JSON fields for nextcloud-version-matrix (e.g. mysql-versions)
        type: string
        default: '{}'
    outputs:
      src:
        description: Whether relevant source files changed
        value: ${{ jobs.changes-and-matrix.outputs.src }}
      matrix:
        description: Sparse PHP/server test matrix
        value: ${{ jobs.changes-and-matrix.outputs.matrix }}

jobs:
  changes-and-matrix:
    runs-on: ubuntu-latest-low
    permissions:
      contents: read
      pull-requests: read

    outputs:
      src: ${{ steps.changes.outputs.src }}
      matrix: ${{ steps.versions.outputs.sparse-matrix }}

    steps:
      - uses: dorny/paths-filter@v4
        id: changes
        continue-on-error: true
        with:
          filters: |
            src:
              - '.github/workflows/**'
              - 'appinfo/**'
              - 'lib/**'
              - 'templates/**'
              - 'tests/**'
              - 'vendor/**'
              - 'vendor-bin/**'
              - '.php-cs-fixer.dist.php'
              - 'composer.json'
              - 'composer.lock'
              - 'sonar-project.properties'

      - name: Checkout app
        if: steps.changes.outputs.src != 'false'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get version matrix
        if: steps.changes.outputs.src != 'false'
        id: versions
        uses: nextcloud-libraries/nextcloud-version-matrix@v1.3.3
        with:
          matrix: ${{ inputs.extra-matrix }}
