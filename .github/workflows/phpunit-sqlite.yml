name: PHPUnit SQLite

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes-and-matrix:
    uses: ./.github/workflows/phpunit-prepare.yml

  phpunit-sqlite:
    runs-on: ubuntu-latest-low

    needs: changes-and-matrix
    if: needs.changes-and-matrix.outputs.src != 'false'

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes-and-matrix.outputs.matrix) }}

    name: SQLite PHP ${{ matrix.php-versions }} Nextcloud ${{ matrix.server-versions }}

    steps:
      - uses: ./.github/actions/phpunit
        with:
          database: sqlite
          php-version: ${{ matrix.php-versions }}
          server-version: ${{ matrix.server-versions }}
          php-db-extensions: sqlite, pdo_sqlite
          coverage: pcov
          upload-coverage: true

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest-low
    needs: [changes-and-matrix, phpunit-sqlite]

    if: always()

    name: phpunit-sqlite-summary

    steps:
      - uses: ./.github/actions/phpunit-summary
        with:
          src: ${{ needs.changes-and-matrix.outputs.src }}
          phpunit-result: ${{ needs.phpunit-sqlite.result }}
